<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker CI/CD Demo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 650px;
            padding: 40px;
        }
        h1 { color: #58a6ff; font-size: 38px; }
        p { color: #aab8cc; line-height: 1.8; }
        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #123c32;
            color: #45d49a;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dockerized Web Application</h1>
        <p>Built by Kartik Verma</p>
        <p>Demonstrating Docker containerization and
           automated CI/CD using GitHub Actions.</p>
        <div class="status">Application Running Successfully</div>
    </div>
</body>
</html>
